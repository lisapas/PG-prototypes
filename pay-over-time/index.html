<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay Over Time Prototype v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>

:root{
  /* Plum Guide checkout, sampled from plumguide.com/book/payment */
  --page:#f9f9f9;
  --card:#ffffff;
  --ink:#262626;
  --ink-2:#4a4a4a;
  --muted:#767676;
  --line:#ececec;
  --mustard:#f5b232;
  --mustard-soft:#ffd98f;
  --mustard-ring:#fde9bd;
  --track:#eee8e3;
  --cream:#fcf6e6;
  --link:#8a6a2e;
  --fee:#b9831c;
  --save:#e3f1e7;
  --save-ink:#2f6b44;

  /* settings bar */
  --bar:#1c1c1c;
  --bar-2:#2a2a2a;
  --bar-ink:#f2f2f2;
  --bar-muted:#9a9a9a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ---------- Settings bar ---------- */
.settings{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:12px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.settings-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #333}
.settings-head strong{font-size:13px;font-weight:600;letter-spacing:.01em}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bar-2);padding:3px 8px;border-radius:4px;color:var(--mustard)}
.settings-head .spacer{flex:1}
.btn{background:var(--bar-2);border:1px solid #3a3a3a;border-radius:4px;padding:5px 10px;cursor:pointer;color:var(--bar-ink)}
.btn:hover{border-color:#555}
.settings-body{display:flex;flex-wrap:wrap;gap:12px 28px;padding:12px 16px 14px}
.settings.collapsed .settings-body{display:none}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.group h3{margin:0;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--bar-muted)}
.group h3 b{color:var(--mustard);font-weight:700;margin-right:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.settings label{display:flex;align-items:center;gap:6px;color:var(--bar-muted)}
.settings select,.settings input[type=text],.settings input[type=number]{background:var(--bar-2);color:var(--bar-ink);border:1px solid #3a3a3a;border-radius:4px;padding:5px 6px;font:inherit;font-size:12px;max-width:100%}
.settings input[type=number]{width:72px}
.settings input[type=text]{width:150px}
.settings select:disabled{opacity:.4;cursor:not-allowed}
.settings label:has(input:disabled){opacity:.4;cursor:not-allowed}
.settings select:focus,.settings input:focus{outline:1px solid var(--mustard);border-color:var(--mustard)}
.settings input[type=checkbox]{accent-color:var(--mustard)}
.hint{color:var(--bar-muted);font-size:11px}

/* ---------- Stage ---------- */
.stage{padding:40px 16px 80px;display:flex;justify-content:center;align-items:flex-start;gap:40px}
.col{width:100%;max-width:620px;transition:max-width .2s}
.side{flex:none;width:380px}
@media (max-width:1060px){.stage{flex-direction:column;align-items:center}.side{width:100%;max-width:620px;margin-top:0}}
.col.mobile{max-width:375px}
h2.section{font-weight:500;font-size:22px;line-height:1.3;margin:0 0 14px;letter-spacing:-.005em}

.card{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.opt{position:relative;display:flex;gap:16px;padding:22px 24px;cursor:pointer;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--mustard)}
.col.mobile .opt{padding:18px 16px;gap:12px}

.radio{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--ink);margin-top:1px;background:#fff}
.sel .radio{border-color:var(--mustard);background:radial-gradient(circle,var(--mustard) 0 5.5px,var(--mustard-ring) 6px 100%)}

.opt-main{flex:1;min-width:0}
.opt-top{display:flex;align-items:flex-start;gap:12px}
.opt-titles{flex:1;min-width:0}
.title{font-weight:500;font-size:16px;line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.desc{font-size:14px;line-height:1.5;color:var(--ink-2);margin-top:4px;margin-right:48px}
.incl{font-weight:400}
.benefit{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink-2);margin-top:8px}
.benefit svg{flex:none;margin-top:3px}
.benefit.green{color:var(--save-ink)}
.benefit.pill{display:flex;width:fit-content;align-items:center;gap:5px;background:var(--save);color:var(--save-ink);border:1px solid #cfe6d6;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;line-height:1.3}
.benefit.pill svg{margin-top:0}
.benefits{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px}
.benefits .benefit{margin-top:0}
.benefits:has(.pill){column-gap:8px}
.note{font-size:12px;line-height:1.4;color:var(--muted);margin-top:3px}
.more{display:inline-block;margin-top:10px;font-size:13px;color:#704F0A;text-decoration:underline;text-decoration-color:#704F0A;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0}

.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:#f3f3f3;color:#555;border:1px solid var(--line);white-space:nowrap}

.amt-right{text-align:right;flex:none}
.amt-right .v{font-weight:500;font-size:16px;line-height:1.35}
.amt-right .l{font-size:12px;color:var(--muted)}
.amt-hero{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.amt-hero .v{font-family:Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:-.01em}
.amt-hero .l{font-size:13px;color:var(--ink-2)}

/* deposit chooser (Pay over time as a product) */
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chips + .desc{margin-top:12px}
.chip{flex:1;min-width:120px;text-align:center;border:1px solid #d9d9d9;border-radius:999px;background:#fff;padding:10px 16px;cursor:pointer}
.chip .k{font-weight:500;font-size:14px}
.chip .s{font-size:12px;color:var(--muted);margin-top:2px}
.chip.on{border-color:var(--mustard);background:#fffaf0;box-shadow:inset 0 0 0 1px var(--mustard)}

/* ---------- Progress variants ---------- */
.prog{margin-top:16px}
.pb-labels{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-2);line-height:1.5}
.pb-labels .r{text-align:right}
.pb-labels b{display:block;font-weight:500;color:var(--ink);font-size:13px}
.pb{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%;background:var(--mustard-soft);border-radius:99px}
.tl{position:relative;padding-left:4px}
.tl-item{position:relative;display:flex;gap:14px;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
/* small dots (unlike the 20px radios): filled black = today, hollow = later */
.tl-item::before{content:"";position:absolute;left:4px;top:17px;bottom:-2px;width:1px;background:#cfcfcf}
.tl-item:last-child::before{display:none}
.tl-dot{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1px solid var(--ink);background:#fff}
.tl-dot.now{background:var(--ink)}
.tl-body{flex:1;display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.45}
.tl-body .when{color:var(--ink-2)}
.tl-body .when b{color:var(--ink);font-weight:500;display:block}
.tl-body .v{font-weight:500;text-align:right;white-space:nowrap}

.rings{display:flex;gap:40px}
.ring-item{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:13px;line-height:1.4;color:var(--ink-2)}
.ring-item svg{margin-bottom:8px}
.ring-item b{font-weight:500;color:var(--ink)}

.feeline{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--fee);margin-top:10px;padding-top:8px;border-top:1px dashed #ead9b0}
.feeline.in-row{margin-top:2px;border:0;padding-top:0}

/* ---------- Summary + CTA ---------- */
.summary{background:#fff;border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.summary-in{padding:24px 24px 20px}
.summary h4{margin:0 0 12px;font-weight:500;font-size:20px}
.s-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.5;padding:2px 0}
.s-row.disc{color:var(--save-ink)}
.s-code{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:500;padding:16px 0 0;border-top:1px solid #DAD4D0;margin:28px 0 0}
.s-div.s-gap{margin:16px 0 14px}
.s-instant{display:flex;gap:14px;background:var(--cream);padding:18px 24px 20px;font-size:14px;line-height:1.5}
.s-instant svg{flex:none;margin-top:2px}
.s-instant b{display:block;font-weight:500}
.s-row.muted{color:var(--muted);padding-left:12px}
.s-row.fee{color:var(--fee)}
.s-row.strong{font-weight:500;font-size:14px}
.s-row.big{font-weight:500;font-size:15px}
.s-row.big .v{font-size:18px}
.s-div{height:1px;background:var(--line);margin:10px 0}
.cta{margin-top:24px;width:100%;border:0;background:var(--mustard);color:var(--ink);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:18px 16px;cursor:pointer}
.cta-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,30,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.scrim.open{display:flex}
.modal{background:#fff;border-radius:32px;max-width:560px;width:100%;padding:36px 36px 32px;position:relative;max-height:90vh;overflow:auto}
.modal .close{position:absolute;top:24px;right:28px;font-size:16px;background:none;border:0;cursor:pointer;color:var(--ink-2)}
.modal h3{margin:4px 0 12px;font-weight:500;font-size:20px}
.modal p{font-size:16px;line-height:1.55;margin:0 0 14px}
.modal ul{margin:0;padding-left:18px;font-size:16px;line-height:1.55}
.modal li{margin-bottom:12px}
.modal b{font-weight:500}
.modal h4{margin:26px 0 6px;font-weight:500;font-size:16px}
/* modal: payment timeline, divider, tick list */
.modal .m-sub{color:var(--ink-2);margin-bottom:22px}
.m-tl .tl-body{font-size:16px;line-height:1.5}
.m-tl .tl-dot{margin-top:7px}
.m-tl .tl-item::before{top:21px}
.m-tl .tl-item{padding-bottom:20px}
.m-tl .tl-item:last-child{padding-bottom:0}
.m-div{height:1px;background:var(--line,#e6e6e6);margin:24px 0 0}
.modal ul.m-ticks{list-style:none;padding:0}
.m-ticks li{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.m-ticks svg{flex:none;width:14px;height:14px;margin-top:5px}
.modal h3{padding-right:56px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bar);color:#fff;font:12px -apple-system,system-ui,sans-serif;padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="settings" id="settings">
  <div class="settings-head">
    <strong>Pay over time prototype</strong>
    <span class="code" id="code" title="Variant code: packaging · fee · benefit · amount · progress"></span>
    <span class="spacer"></span>
    <button class="btn" id="copy">Copy link to this variant</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="toggle">Hide settings</button>
  </div>
  <div class="settings-body">
    <div class="group">
      <h3><b>1</b>Options</h3>
      <select id="pkg">
        <option value="secure">A · Three separate options</option>
        <option value="product">B · Combined as Pay over time</option>
      </select>
    </div>
    <div class="group">
      <h3><b>2</b>Fee</h3>
      <div class="row">
        <select id="fee" title="How the fee is shown">
          <option value="sentence">A · In the description</option>
          <option value="progress">B · In the progress</option>
          <option value="badge">C · Badge on instalments</option>
        </select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="nonRefund"> Make fee non-refundable</label>
      </div>
    </div>
    <div class="group">
      <h3><b>3</b>Amount to pay</h3>
      <div class="row">
        <select id="amt">
          <option value="inline">A · In the description</option>
          <option value="right-sel">B · Price column, selected only</option>
          <option value="hidden">C · Not in the option</option>
        </select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="cta"> Amount on pay button</label>
      </div>
    </div>
    <div class="group">
      <h3><b>4</b>Benefit</h3>
      <div class="row">
        <select id="benefit" title="Where the benefits show">
          <option value="modal">A · None</option>
          <option value="both">B · In the option when selected</option>
          <option value="always">C · In the option, always visible</option>
        </select>
        <select id="benStyle" title="How the inline benefits look">
          <option value="grey">Grey text</option>
          <option value="green">Green text</option>
          <option value="pill">Green pill</option>
        </select>
      </div>
    </div>
    <div class="group">
      <h3><b>5</b>Progress</h3>
      <select id="prog">
        <option value="bar">A · Progress bar</option>
        <option value="tl">B · Timeline</option>
        <option value="ring">C · Ring</option>
      </select>
    </div>
  </div>
</div>

<main class="stage">
  <div class="col" id="col">
    <h2 class="section">Payment options</h2>
    <div class="card" id="options" role="radiogroup" aria-label="Payment options"></div>
    <div id="after"></div>
  </div>
  <aside class="side" id="side"></aside>
</main>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose">Close</button>
    <div id="mBody"></div>
  </div>
</div>
<div class="toast" id="toast">Link copied</div>

<script>
const DEFAULTS = {
  pkg:'secure', prog:'bar', fee:'sentence', benefit:'modal', benStyle:'grey',
  amt:'inline', cta:false, nonRefund:false,
  name:'none', plans:'both', cur:'GBP', total:6720.70, f10:75, f50:60, when:'today', date:'19 Dec 2026', cancel:'10 Dec 2026', width:'desktop'
};
const FIELDS = Object.keys(DEFAULTS);
const LETTER = {
  pkg:['secure','product'],
  prog:['bar','tl','ring'],
  fee:['sentence','progress','badge'],
  amt:['inline','right-sel','hidden']
};

let S = {...DEFAULTS};
let sel = 'full';     // 'full' | 50 | 10 | 'split' (set to the second option on load, see firstSplit)
let dep = 10;         // chosen deposit inside Pay over time-as-a-product

const $ = id => document.getElementById(id);

/* ---------- state <-> URL ---------- */
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of FIELDS){
    if (!p.has(k)) continue;
    const d = DEFAULTS[k], v = p.get(k);
    S[k] = typeof d === 'boolean' ? v === '1' : typeof d === 'number' ? (parseFloat(v) || 0) : v;
  }
  // Links saved before options were removed
  if (!LETTER.fee.includes(S.fee)) S.fee = DEFAULTS.fee;
  if (!LETTER.amt.includes(S.amt)) S.amt = DEFAULTS.amt;
  if (!LETTER.pkg.includes(S.pkg)) S.pkg = DEFAULTS.pkg;
  if (!LETTER.prog.includes(S.prog)) S.prog = DEFAULTS.prog;
  if (S.benefit === 'inline') S.benefit = 'both';
  if (!['modal', 'both', 'always'].includes(S.benefit)) S.benefit = DEFAULTS.benefit;
  if (!['grey', 'green', 'pill'].includes(S.benStyle)) S.benStyle = DEFAULTS.benStyle;
  S.name = DEFAULTS.name;  // the fee name setting was removed
  const s = p.get('sel');
  sel = firstSplit();  // preselect the second option so setting changes show straight away
  if (s === 'full') sel = 'full';
  else if (s === 'split') sel = 'split';
  else if (s === '50' || s === '10') sel = Number(s);
  if (p.has('dep')) dep = Number(p.get('dep'));
}
function writeHash(){
  const p = new URLSearchParams();
  for (const k of FIELDS){
    if (S[k] === DEFAULTS[k]) continue;
    p.set(k, typeof S[k] === 'boolean' ? (S[k] ? '1' : '0') : S[k]);
  }
  p.set('sel', sel);
  if (S.pkg === 'product' && dep !== 10) p.set('dep', dep);
  history.replaceState(null, '', '#' + p.toString());
}
function syncControls(){
  for (const k of FIELDS){
    const el = $(k);
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = S[k]; else el.value = S[k];
  }
  $('benStyle').disabled = S.benefit === 'modal';
}

/* ---------- money ---------- */
const fmt = n => new Intl.NumberFormat('en-GB', {style:'currency', currency:S.cur}).format(n);
const fmtFee = n => new Intl.NumberFormat('en-GB', {style:'currency', currency:S.cur, minimumFractionDigits: n % 1 ? 2 : 0}).format(n);

const feeName = () => S.name === 'none' ? 'Additional cost' : S.name;
const BENEFITS = ['Your dates, secured', 'More time to pay', "Today's exchange rate, locked in"];
const splits = () => S.plans === 'both' ? [50, 10] : [Number(S.plans)];
const firstSplit = () => S.pkg === 'product' ? 'split' : splits()[0];

// Where 50% is the only split on offer it carries the 10% amount (product doc rule).
function feeFor(p){
  if (p === 50 && S.plans === 'both') return S.f50;
  return S.f10;
}
// Mirrors the live checkout: the later payment is rounded down to whole units, today takes the pennies.
function calc(p){
  const total = S.total;
  if (!p) return {total, today: total, later: 0, fee: 0, grand: total};
  const fee = feeFor(p);
  const laterBase = Math.floor(total * (1 - p/100));
  const deposit = Math.round((total - laterBase) * 100) / 100;
  return {
    total, fee, deposit, laterBase,
    today: deposit + (S.when === 'today' ? fee : 0),
    later: laterBase + (S.when === 'later' ? fee : 0),
    grand: total + fee
  };
}

/* ---------- copy ---------- */
// "No name": the fee is shown as a bare amount; line items fall back to a neutral label.
const noName = () => S.name === 'none';
const feeWithName = f => noName() ? fmtFee(f) : `${fmtFee(f)} ${feeName()}`;
// "the £75 plan fee" reads better than "the £75 for Plan fee"

function titleFor(p, c){
  if (!p) return S.pkg === 'amt' ? `Pay ${fmt(c.total)} now` : 'Pay in full today';
  switch (S.pkg){
    case 'amt': return `Pay ${fmt(c.today)} now, the rest later`;
    case 'deposit': return p === 10 ? 'Pay a 10% deposit' : 'Pay half now';
    case 'secure': return p === 10 ? 'Secure your stay with 10%' : 'Pay half now';
    default: return `Pay ${p}% now, the rest later`;
  }
}

// Split lines say how the balance is collected ("interest-free" is left out: the fee may count as interest).
function descFor(p, c, selected){
  const inline = S.amt === 'inline';
  if (!p){
    let s = S.pkg === 'amt' || !inline ? `One payment, nothing more to pay later` : `Pay ${fmt(c.total)} now, and that's it.`;
    return s;
  }
  const collect = `We'll automatically collect the balance on ${S.date}.`;
  const collectAmt = `We'll automatically collect the remaining ${fmt(c.later)} on ${S.date}.`;
  let s;
  switch (S.pkg){
    case 'amt': s = collectAmt; break;
    case 'product': {
      // Today's amount for the chosen deposit; fee A names the fee in the same sentence.
      const fee = S.fee === 'sentence' && c.fee ? ` (includes a ${fmtFee(c.fee)} ${S.nonRefund ? '' : 'refundable '}payment plan fee)` : '';
      return `Pay ${fmt(c.today)} today${fee}. We'll collect the balance automatically on ${S.date}.`;
    }
    default: {
      // In the description: the fee sits right after today's amount.
      const note = S.fee === 'sentence' && c.fee ? ` (includes a ${fmtFee(c.fee)} ${S.nonRefund ? '' : 'refundable '}payment plan fee)` : '';
      s = inline ? `Pay ${fmt(c.today)} today${note}. ${collect}` : collect;
    }
  }
  // Without the amount in the sentence, the fee goes at the end instead.
  if (S.fee === 'sentence' && c.fee && (!inline || S.pkg === 'amt' || S.pkg === 'product')) s += ` Includes a ${fmtFee(c.fee)} ${S.nonRefund ? '' : 'refundable '}payment plan fee.`;
  return s;
}


/* ---------- pieces ---------- */
const tagIcon = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6.6 1.5H10.5v3.9L5.4 10.5 1.5 6.6z" fill="none" stroke="currentColor" stroke-linejoin="round"/><circle cx="8.3" cy="3.7" r=".8" fill="currentColor"/></svg>`;
const tickIcon = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.4l2.6 2.6L10 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function amountBlock(p, c, where, selected){
  const v = p ? c.today : c.total;
  if (where === 'right' && S.amt === 'right-sel' && selected)
    return `<div class="amt-right"><div class="v">${fmt(v)}</div></div>`;
  return '';
}

function badges(p, c, selected){
  if (!p) return '';
  if (S.fee === 'badge' && c.fee) return `<span class="pill">+${feeWithName(c.fee)}</span>`;
  return '';
}

function feeRowText(c){
  return `${noName() ? 'Additional cost' : feeName()}`;
}

function progress(p, c){
  const grand = c.grand;
  // Fee option B spells out the deposit + fee for today; C shows today's total with the fee folded in.
  const todayAmt = S.fee === 'progress' ? `${fmt(c.deposit)} <span class="incl">+ ${fmtFee(c.fee)} ${S.nonRefund ? '' : 'refundable '}payment plan fee</span>`
    : S.fee === 'badge' ? `${fmt(c.today)} <span class="incl">(includes ${fmtFee(c.fee)} payment plan fee)</span>`
    : fmt(c.today);

  if (S.prog === 'bar'){
    const pct = (c.today / grand) * 100;
    return `<div class="prog">
      <div class="pb-labels">
        <div>Due today<b>${todayAmt}</b></div>
        <div class="r">${S.date}<b>${fmt(c.later)}</b></div>
      </div>
      <div class="pb"><i style="width:${pct}%"></i></div>
    </div>`;
  }

  if (S.prog === 'tl'){
    const item = (dot, when, sub, v) => `<div class="tl-item"><span class="tl-dot ${dot}"></span><div class="tl-body"><div class="when"><b>${when}</b>${sub}</div>${v ? `<div class="v">${v}</div>` : ''}</div></div>`;
    return `<div class="prog tl">
      ${item('now', 'Today', `${p}% to confirm your booking`, todayAmt)}
      ${item('', S.date, 'Collected automatically', fmt(c.later))}
    </div>`;
  }

  if (S.prog === 'ring'){
    // One ring per payment, filled to the cumulative share paid after it (PayPal "Pay in 3" pattern).
    const r = 20, C = 2 * Math.PI * r;
    const ring = (frac, v, label) => `<div class="ring-item">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--track)" stroke-width="6"/>
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--mustard)" stroke-width="6" stroke-dasharray="${C * frac} ${C}" transform="rotate(-90 26 26)" stroke-linecap="round"/>
      </svg>
      ${v ? `<b>${v}</b>` : ''}<span>${label}</span>
    </div>`;
    return `<div class="prog rings">
      ${ring(c.today / grand, todayAmt, 'due today')}
      ${ring(1, fmt(c.later), S.date)}
    </div>`;
  }
  return '';
}

/* ---------- options ---------- */
function optionHTML({key, p, title, desc, body, selected, lead = ''}){
  const c = calc(p);
  return `<div class="opt ${selected ? 'sel' : ''}" role="radio" aria-checked="${selected}" tabindex="0" data-key="${key}">
    <span class="radio"></span>
    <div class="opt-main">
      <div class="opt-top">
        <div class="opt-titles">
          <div class="title">${title}${badges(p, c, selected)}</div>
          ${lead}
          ${desc ? `<div class="desc">${desc}</div>` : ''}
        </div>
        ${amountBlock(p, c, 'right', selected)}
      </div>
      ${body}
    </div>
  </div>`;
}

// Shown on the selected option only, unless "Show always" is ticked.
// The modal always lists the benefits; B adds them to the selected option, C to every option.
const benefitLine = selected => (S.benefit === 'both' && selected) || S.benefit === 'always'
  ? `<div class="benefits">${BENEFITS.map(t => `<div class="benefit ${S.benStyle}">${tickIcon}<span>${t}</span></div>`).join('')}</div>` : '';

function splitBody(p, c, selected){
  let b = amountBlock(p, c, 'body');
  // For Pay over time as a product the benefit is added in render, below the description.
  if (S.pkg !== 'product') b += benefitLine(selected);
  b += `<button class="more" data-more="${p}">How it works</button>`;
  if (selected) b += progress(p, c);
  return b;
}

function render(){
  const opts = [];
  const full = calc(0);
  let fullBody = amountBlock(0, full, 'body');
  opts.push(optionHTML({key:'full', p:0, title:titleFor(0, full), desc:descFor(0, full), body:fullBody, selected: sel === 'full'}));

  const ps = splits();
  if (S.pkg === 'product'){
    if (!ps.includes(dep)) dep = ps[0];
    const p = dep, c = calc(p), on = sel !== 'full';
    let chips = '';
    if (on && ps.length > 1){  // deposit boxes only once Pay over time is chosen, right under the title
      chips = `<div class="chips">${ps.slice().sort((a,b)=>a-b).map(q => {
        return `<button class="chip ${on && q === dep ? 'on' : ''}" data-dep="${q}"><div class="k">Pay ${q}% today</div></button>`;
      }).join('')}</div>`;
    }
    const body = benefitLine(on) + splitBody(p, c, on);
    // Not selected: name the deposit choices.
    const tagline = `Pay ${ps.slice().sort((a,b)=>a-b).join('% or ')}% now (includes a ${S.nonRefund ? '' : 'refundable '}fee). We'll automatically collect the balance on ${S.date}.`;
    opts.push(optionHTML({key:'split', p, title:'Pay over time', desc: on ? descFor(p, c) : tagline, body, selected:on, lead:chips}));
  } else {
    for (const p of ps){
      const c = calc(p);
      opts.push(optionHTML({key:String(p), p, title:titleFor(p, c), desc:descFor(p, c, sel === p), body:splitBody(p, c, sel === p), selected: sel === p}));
    }
  }
  $('options').innerHTML = opts.join('');
  $('col').classList.toggle('mobile', S.width === 'mobile');
  renderAfter();
  renderCode();
}

function selectedP(){
  if (sel === 'full') return 0;
  return S.pkg === 'product' ? dep : sel;
}

function renderAfter(){
  const p = selectedP(), c = calc(p);
  // Stay price, back-calculated from the booking total: 14 nights less a weekly discount.
  const nights = 14, nightly = Math.round(S.total / 0.95 / nights * 100) / 100, stay = nightly * nights;
  const feeName = S.pkg === 'product' ? 'Pay over time fee' : 'payment plan fee';
  const feeRow = `${S.nonRefund ? 'Non-refundable' : 'Refundable'} ${feeName}`;
  const sub = (k, v) => `<div class="s-row muted"><span>${k}</span><span class="v">${v}</span></div>`;
  const chevron = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const bolt = `<svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M10.5 1.5L3 12.5h5.5L7 20.5l8-11.5H9.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  // Payment summary sits in the right-hand column: stay price, what's due today, then the code field.
  // A refundable fee is part of the booking price, so it sits with the stay; non-refundable stays under Due today.
  $('side').innerHTML = `<div class="summary"><div class="summary-in">
      <h4>Payment summary</h4>
      <div class="s-row"><span>${fmt(nightly)} x ${nights} nights</span><span class="v">${fmt(stay)}</span></div>
      <div class="s-row disc"><span>Weekly discount</span><span class="v">- ${fmt(stay - S.total)}</span></div>
      <div class="s-row"><span>Service &amp; cleaning fees</span><span class="v">Included</span></div>
      ${p && !S.nonRefund ? `<div class="s-row"><span>${feeRow}</span><span class="v">${fmt(c.fee)}</span></div>` : ''}
      <div class="s-div s-gap"></div>
      <div class="s-row big"><span>${p ? 'Due today' : 'Total booking'}</span><span class="v">${fmt(c.today)}</span></div>
      ${p ? `${S.nonRefund ? sub(`${p}% of booking total`, fmt(c.deposit)) + sub(feeRow, fmt(c.fee)) : ''}
             ${S.nonRefund ? '<div class="s-div"></div>' : ''}
             <div class="s-row"${S.nonRefund ? ' style="margin-top:8px"' : ''}><span>Due ${S.date}</span><span class="v">${fmt(c.later)}</span></div>
             <div class="s-div"></div>
             <div class="s-row strong"><span>${S.nonRefund ? 'Total' : 'Total booking'}</span><span class="v">${fmt(c.today + c.later)}</span></div>` : ''}
      <div class="s-code"><span>Add a code</span>${chevron}</div>
    </div>
    <div class="s-instant">${bolt}<div><b>Instant book</b>Once your payment goes through, your booking is confirmed instantly.</div></div>
  </div>`;
  let html = `<button class="cta">${S.cta ? `Pay ${fmt(c.today)} securely now` : 'Pay securely now'}</button>`;
  if (S.cta && p) html += `<div class="cta-sub">Then ${fmt(c.later)} on ${S.date}</div>`;
  $('after').innerHTML = html;
}

function renderCode(){
  const l = k => String.fromCharCode(65 + LETTER[k].indexOf(S[k]));
  $('code').textContent = `1${l('pkg')} · 2${l('fee')} · 3${l('amt')} · 4${String.fromCharCode(65 + $('benefit').selectedIndex)} · 5${l('prog')}`;
}

/* ---------- modal ---------- */
// Long-form date for the modal ("19 Dec 2026" -> "19 December 2026"); falls back to the text as typed.
function longDate(t){
  const d = new Date(t);
  return isNaN(d) ? t : d.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
}

// Short date offset by n days, e.g. shortDate('19 Dec 2026', -3) -> '16 Dec 2026'.
function shortDate(t, n = 0, year = true){
  const d = new Date(t);
  if (isNaN(d)) return t;
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString('en-GB', year ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'});
}

function openModal(p){
  const c = calc(p);
  const feeLabel = 'payment plan fee';
  const fee = fmtFee(c.fee);
  const step = (dot, when, sub) => `<div class="tl-item"><span class="tl-dot ${dot}"></span><div class="tl-body"><div class="when"><b>${when}</b>${sub}</div></div></div>`;
  $('mBody').innerHTML = `
    <h3 id="mTitle">Pay over time</h3>
    <p class="m-sub">Book your stay now and pay the rest closer to your trip.</p>
    <div class="tl m-tl">
      ${step('now', 'Today', S.nonRefund ? `${p}% of your booking total, plus a ${fee} ${feeLabel}` : `Pay ${p}% of your stay, plus a ${fee} refundable ${S.pkg === 'product' ? 'Pay over time fee' : feeLabel}`)}
      ${step('', shortDate(S.date, -3), `We'll email you a reminder`)}
      ${step('', S.date, 'We\'ll automatically charge the rest to your saved payment method')}
    </div>
    <div class="m-div"></div>
    <h4>About the fee</h4>
    <p>The ${fee} fee covers the cost of holding your stay until your final payment. ${S.nonRefund ? `It's non-refundable, but everything else follows your stay's cancellation policy as usual.` : `If you cancel and you're due a refund, you'll get the fee back in full.`}</p>
    <h4>Good to know</h4>
    <p>Keep your payment details up to date. If we can't collect the payment on ${shortDate(S.date, 0, false).replace(' ', '&nbsp;')}, your booking may be cancelled.</p>`;
  $('scrim').classList.add('open');
  $('mClose').focus();
}

function closeModal(){ $('scrim').classList.remove('open'); }

/* ---------- events ---------- */
for (const k of FIELDS){
  const el = $(k);
  if (!el) continue;
  el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', () => {
    const d = DEFAULTS[k];
    S[k] = el.type === 'checkbox' ? el.checked : typeof d === 'number' ? (parseFloat(el.value) || 0) : el.value;
    if (k === 'pkg' && sel !== 'full') sel = S.pkg === 'product' ? 'split' : splits()[0];
    if (k === 'plans' && sel !== 'full' && S.pkg !== 'product' && !splits().includes(sel)) sel = splits()[0];
    syncControls(); writeHash(); render();
  });
}

$('options').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more){ e.stopPropagation(); openModal(Number(more.dataset.more)); return; }
  const chip = e.target.closest('[data-dep]');
  if (chip){ dep = Number(chip.dataset.dep); sel = 'split'; writeHash(); render(); return; }
  const opt = e.target.closest('.opt');
  if (!opt) return;
  const k = opt.dataset.key;
  sel = k === 'full' ? 'full' : k === 'split' ? 'split' : Number(k);
  writeHash(); render();
});
$('options').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('opt')){ e.preventDefault(); e.target.click(); }
});

$('mClose').onclick = closeModal;
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('toggle').onclick = () => {
  const c = $('settings').classList.toggle('collapsed');
  $('toggle').textContent = c ? 'Show settings' : 'Hide settings';
};
$('reset').onclick = () => { S = {...DEFAULTS}; sel = firstSplit(); dep = 10; syncControls(); writeHash(); render(); };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); } catch (e) {}
  const t = $('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1400);
};

readHash();
syncControls();
render();
</script>
</body>
</html>
